name: Bulk Delete Fast (plan, batched delete, verify)

# Fast version of bulk_delete_chain.yml: the same plan (SKUs currently on the sheet are pardoned, EXCLUDE_FILE
# skipped), then ONE batched delete run (delete_listings_batch.py: up to 100 SKUs per request - OnBuy allows only
# 240 DELETE requests an hour and the old chain spends one per SKU, hours for a big list) and a verify sweep.
# dry_run=yes (default) plans and counts only. Holds the onbuy-api group for the run - dispatch when it is idle.
# The old chain stays as the fallback (the batch tool says so itself if OnBuy stops answering per SKU).

on:
  workflow_dispatch:
    inputs:
      list_file:
        description: "Repo path: SKUs to delete (one per line)"
        required: true
      exclude_file:
        description: "Repo path: SKUs already attempted (skipped)"
        required: false
        default: ""
      dry_run:
        description: "yes = plan and count only; no = delete"
        required: false
        default: "yes"

permissions:
  contents: read

concurrency:
  group: onbuy-api
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compute deletable set (sheet-synced SKUs are pardoned)
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          LIST_FILE: ${{ inputs.list_file }}
          EXCLUDE_FILE: ${{ inputs.exclude_file }}
        run: python plan_bulk_delete.py
      - uses: actions/upload-artifact@v4
        with:
          name: chunks
          path: chunks/

  delete:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: chunks
          path: chunks/
      - name: Delete (batched)
        env:
          DELETE_SKUS_FILE: chunks/deletable.txt
          DRY_INPUT: ${{ inputs.dry_run }}
          ONBUY_USE_SANDBOX: ${{ vars.ONBUY_USE_SANDBOX }}
          ONBUY_CONSUMER_KEY: ${{ secrets.ONBUY_CONSUMER_KEY }}
          ONBUY_SECRET_KEY: ${{ secrets.ONBUY_SECRET_KEY }}
          ONBUY_SELLER_ID: ${{ secrets.ONBUY_SELLER_ID }}
          ONBUY_SITE_ID: ${{ secrets.ONBUY_SITE_ID }}
        run: |
          if [ ! -s chunks/deletable.txt ]; then
            echo "nothing deletable - every SKU of the list is on the sheet or already attempted"
            exit 0
          fi
          if [ "$DRY_INPUT" = "no" ]; then export DRY_RUN=0; else export DRY_RUN=1; fi
          python delete_listings_batch.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: delete-results
          path: delete_results.csv
          if-no-files-found: ignore

  verify:
    needs: [plan, delete]
    if: ${{ always() && inputs.dry_run == 'no' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: chunks
          path: chunks/
      - name: Probe live listings and tally
        env:
          ONBUY_USE_SANDBOX: ${{ vars.ONBUY_USE_SANDBOX }}
          ONBUY_CONSUMER_KEY: ${{ secrets.ONBUY_CONSUMER_KEY }}
          ONBUY_SECRET_KEY: ${{ secrets.ONBUY_SECRET_KEY }}
          ONBUY_SELLER_ID: ${{ secrets.ONBUY_SELLER_ID }}
          ONBUY_SITE_ID: ${{ secrets.ONBUY_SITE_ID }}
        run: |
          python probe_listings_skus.py > probe.log
          head -1 probe.log
          python - <<'PY'
          live = set()
          on = False
          for line in open("probe.log", encoding="utf-8"):
              line = line.strip()
              if line == "BEGIN-SKUS": on = True; continue
              if line == "END-SKUS": on = False; continue
              if on and line: live.add(line)
          deletable = [l.strip() for l in open("chunks/deletable.txt", encoding="utf-8") if l.strip()]
          excluded = [l.strip() for l in open("chunks/excluded.txt", encoding="utf-8") if l.strip()]
          remain = sorted(set(deletable) & live)
          print(f"TALLY: deletable {len(deletable)} | STILL LIVE from deletable: {len(remain)}")
          for s in remain[:30]: print("  still live:", s)
          print(f"excluded sheet-synced still live (EXPECTED): {len(set(excluded) & live)}")
          PY
