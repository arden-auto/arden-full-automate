name: Sheet SKUs Dump (read-only)

on:
  workflow_dispatch:
    inputs:
      sheet_id:
        description: "Spreadsheet ID (empty = the store's own sheet by name)"
        required: false
        default: ""

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Dump sheet SKUs
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SHEET_ID: ${{ inputs.sheet_id }}
          SHEET_NAME: Arden_Full_Feed_Master
        run: python sheet_skus_dump.py
