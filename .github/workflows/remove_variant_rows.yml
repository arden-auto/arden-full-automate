name: Remove Variant Rows

on:
  workflow_dispatch:
    inputs:
      block_start:
        description: "First sheet row number of the appended import block"
        required: true
      keep_skus:
        description: "Imported SKUs to keep despite a title match"
        required: false
        default: ""
      dry_run:
        description: "yes = list; no = delete the imported variant rows"
        required: false
        default: "yes"

jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Remove
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          BLOCK_START: ${{ inputs.block_start }}
          KEEP_SKUS: ${{ inputs.keep_skus }}
          DRY_RUN: ${{ inputs.dry_run == 'no' && '0' || '1' }}
        run: python remove_variant_rows.py
